name: Atelje 212 December watch

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch: {}

permissions:
  actions: write   # lets the job disable itself once December is found
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check repertoire
        id: check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set +e
          python3 check_december.py
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ $code -eq 2 ] && exit 1 || exit 0
      - name: Stop watching once found
        if: steps.check.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable "${{ github.workflow }}" -R "${{ github.repository }}"
